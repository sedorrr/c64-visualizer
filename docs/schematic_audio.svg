<text x="400" y="455" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Gemeinsame Masse mit dem C64 verbinden!</text>
<text x="30" y="496" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Signal path / Signalweg:  C64 → P1 (level) → C1 (removes DC) → bias divider R1/R2 (centres signal at 1.65 V) → R3 + D1/D2 (protection) → ADC0</text>
<text x="30" y="516" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">D1/D2: BAT85, BAT43 or 1N5819.   C1 = film/MKT or ceramic, no polarity. C2 = ADC charge reservoir.   Adjust P1 until the magenta clip pixel stays dark on loud passages.</text>
