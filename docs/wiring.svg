<text x="925" y="514" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">5-V-Netzteil, ≥ 2 A</text>
<text x="925" y="542" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#c0392b">+5V out  →  every red +5V flag</text>
<text x="925" y="562" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">GND out  →  every ground symbol</text>
<text x="925" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">USB-only build: panel +5V from VBUS (pin 40), limit 350 mA</text>
<text x="30" y="650" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">1) The panel's +5V/GND feed comes from the PSU, NOT through the Pico.  All grounds (PSU, panel, Pico, C64) are connected.  /  Alle Massen verbinden.</text>
<text x="30" y="670" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">2) The 1N5819 lets the PSU feed VSYS while USB is plugged in. Never wire the PSU to VBUS (pin 40) with USB attached.  /  Netzteil nie an VBUS bei USB.</text>
<text x="30" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">3) MAX7219 variant instead of WS2812: GP19→DIN, GP18→CLK, GP17→CS, VBUS(40)→VCC, GND→GND  (no level shifter, no PSU needed).</text>
</svg>